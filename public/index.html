<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Battle Tier List</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Arial', 'Helvetica', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 2px solid #333;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header img {
  width: 40px;
  height: auto;
  border-radius: 4px;
  border: 2px solid #5a3a1a;
}

.header input {
  background: #1a1a2e;
  border: 1px solid #444;
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 18px;
  font-weight: 700;
  flex: 1;
  max-width: 500px;
}

.header input:focus { outline: none; border-color: #b22222; }

.header .actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.header button {
  background: #b22222;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}

.header button:hover { background: #d32f2f; }
.header button.secondary { background: #333; }
.header button.secondary:hover { background: #444; }

/* Main layout */
.main {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
}

/* Tier list */
.tier-list {
  display: flex;
  flex-direction: column;
}

.tier-row {
  display: flex;
  align-items: stretch;
  min-height: 148px;
  border-bottom: 1px solid #333;
}

.tier-label {
  width: 80px;
  min-height: 148px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.tier-label:hover::after {
  content: '✏️';
  position: absolute;
  bottom: 4px;
  right: 4px;
  font-size: 14px;
}

.tier-label input {
  width: 50px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  text-align: center;
  font-size: 24px;
  font-weight: 900;
  border-radius: 4px;
}

.tier-content {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: rgba(255,255,255,0.03);
  min-height: 148px;
  transition: background 0.15s;
}

.tier-content.drag-over {
  background: rgba(178,34,34,0.15);
}

/* Tier colors */
.tier-s { background: #ff6b6b; }
.tier-a { background: #ff9f43; }
.tier-b { background: #feca57; }
.tier-c { background: #48dbfb; }
.tier-d { background: #54a0ff; }
.tier-e { background: #5f27cd; }
.tier-f { background: #222; }

/* Card pool */
.pool-section {
  background: #111;
  border-top: 2px solid #333;
  border-bottom: 2px solid #333;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 90;
}

.pool-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.pool-header h2 {
  font-size: 18px;
  color: #888;
  font-weight: 700;
}

.pool-header .count {
  background: #333;
  color: #fff;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
}

.pool-header .pool-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.pool-header button {
  background: #333;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

.pool-header button:hover { background: #444; }

.card-pool {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 4px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #444 #222;
}

.card-pool::-webkit-scrollbar { height: 6px; }
.card-pool::-webkit-scrollbar-track { background: #222; border-radius: 3px; }
.card-pool::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

.card-pool.drag-over {
  background: rgba(178,34,34,0.1);
}

/* Cards */
.card {
  width: 90px;
  height: 132px;
  border-radius: 6px;
  overflow: hidden;
  cursor: grab;
  position: relative;
  border: 2px solid transparent;
  transition: transform 0.1s, border-color 0.1s;
  flex-shrink: 0;
}

.card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.3);
}

.card.dragging {
  opacity: 0.4;
  cursor: grabbing;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.card .card-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 8px;
  text-align: center;
  padding: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Capture container */
.capture-container {
  background: #0a0a0a;
  padding: 0;
}

/* Responsive */
@media (max-width: 768px) {
  .header { flex-wrap: wrap; padding: 12px 16px; position: relative; }
  .header input { width: 100%; max-width: none; }
  .tier-label { width: 50px; font-size: 24px; min-height: 121px; }
  .tier-row { min-height: 121px; }
  .tier-content { min-height: 121px; }
  .card { width: 72px; height: 105px; }
  .header button { padding: 8px 12px; font-size: 12px; }
  .pool-section { padding: 10px 12px; }
  .card-pool { gap: 4px; padding: 6px 2px; }
  .pool-header { gap: 8px; margin-bottom: 6px; }
  .pool-header h2 { font-size: 15px; }
  .pool-header button { padding: 4px 10px; font-size: 11px; }
}

/* Hidden during capture */
.hide-on-capture { display: none !important; }

/* Caption */
.capture-caption {
  text-align: center;
  padding: 12px;
  font-size: 14px;
  color: #888;
  font-weight: 700;
  background: #0a0a0a;
  border-top: 1px solid #222;
}
</style>
</head>
<body>

<div class="header" id="header">
  <img src="back.png" alt="logo">
  <div class="actions">
    <button onclick="downloadImage()">📷 Save as PNG</button>
    <button class="secondary" onclick="resetTiers()">Reset</button>
  </div>
</div>

<div class="pool-section" id="poolSection">
  <div class="pool-header">
    <h2>Drag & drop cards below</h2>
  </div>
  <div class="card-pool" id="cardPool"></div>
</div>

<div class="main capture-container" id="captureArea">
  <div class="tier-list" id="tierList"></div>
  <div class="capture-caption" id="caption">hb-tier.vercel.app</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const TIERS = [
  { label: 'S', class: 'tier-s' },
  { label: 'A', class: 'tier-a' },
  { label: 'B', class: 'tier-b' },
  { label: 'C', class: 'tier-c' },
  { label: 'D', class: 'tier-d' },
  { label: 'F', class: 'tier-f' },
];

let cards = [];
let cardLocations = {}; // cardId -> { tier: index, order: n } or { pool: true }
let draggedCardId = null;

async function init() {
  const res = await fetch('cards.json');
  cards = await res.json();
  
  buildTiers();
  buildPool();
}

function buildTiers() {
  const list = document.getElementById('tierList');
  list.innerHTML = '';
  TIERS.forEach((tier, i) => {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `
      <div class="tier-label ${tier.class}" data-tier="${i}" onclick="editLabel(this)">${tier.label}</div>
      <div class="tier-content" data-tier="${i}" ondragover="onDragOver(event, this)" ondragleave="onDragLeave(event, this)" ondrop="onDrop(event, this)"></div>
    `;
    list.appendChild(row);
  });
}

function editLabel(el) {
  const current = el.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  input.maxLength = 3;
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();
  
  const save = () => {
    const val = input.value.trim() || current;
    TIERS[parseInt(el.dataset.tier)].label = val;
    el.innerHTML = val;
  };
  
  input.onblur = save;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { el.innerHTML = current; }
  };
}

function buildPool() {
  const pool = document.getElementById('cardPool');
  pool.innerHTML = '';
  
  const poolCards = cards.filter(c => !cardLocations[c.id]);
  poolCards.forEach(c => {
    const el = createCardEl(c);
    pool.appendChild(el);
  });
  
  updatePoolCount();
}

function createCardEl(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.innerHTML = `<img src="${card.image}" alt="${card.id}" loading="lazy">`;
  
  // Desktop drag-and-drop
  el.addEventListener('dragstart', (e) => {
    draggedCardId = card.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    draggedCardId = null;
  });
  
  // Touch drag-and-drop for mobile
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchDrag.cardId = card.id;
    touchDrag.el = el;
    touchDrag.startX = e.touches[0].clientX;
    touchDrag.startY = e.touches[0].clientY;
  }, { passive: true });
  
  el.addEventListener('touchmove', (e) => {
    if (!touchDrag.cardId) return;
    e.preventDefault();
    const t = e.touches[0];
    touchDrag.x = t.clientX;
    touchDrag.y = t.clientY;
    
    // Create ghost on first move
    if (!touchDrag.ghost) {
      touchDrag.el.classList.add('dragging');
      draggedCardId = touchDrag.cardId;
      const ghost = el.cloneNode(true);
      ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:10000;opacity:0.8;width:' + el.offsetWidth + 'px;height:' + el.offsetHeight + 'px;';
      document.body.appendChild(ghost);
      touchDrag.ghost = ghost;
    }
    
    // Move ghost
    touchDrag.ghost.style.left = (touchDrag.x - touchDrag.ghost.offsetWidth / 2) + 'px';
    touchDrag.ghost.style.top = (touchDrag.y - touchDrag.ghost.offsetHeight / 2) + 'px';
    
    // Highlight drop target
    const target = findDropTarget(touchDrag.x, touchDrag.y);
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (target) target.classList.add('drag-over');
  }, { passive: false });
  
  el.addEventListener('touchend', (e) => {
    if (!touchDrag.cardId) return;
    
    if (touchDrag.ghost) {
      touchDrag.ghost.remove();
      touchDrag.ghost = null;
    }
    touchDrag.el.classList.remove('dragging');
    
    const target = findDropTarget(touchDrag.x, touchDrag.y);
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    
    if (target && touchDrag.cardId) {
      const card = cards.find(c => c.id === touchDrag.cardId);
      if (card) {
        const oldEl = document.querySelector(`.card[data-card-id="${touchDrag.cardId}"]`);
        if (oldEl) oldEl.remove();
        const newEl = createCardEl(card);
        const afterElement = getDragAfterElement(target, touchDrag.x);
        if (afterElement) {
          target.insertBefore(newEl, afterElement);
        } else {
          target.appendChild(newEl);
        }
        syncPool();
      }
    }
    
    touchDrag.cardId = null;
    touchDrag.el = null;
    draggedCardId = null;
  }, { passive: true });
  
  return el;
}

// Touch drag state
const touchDrag = { cardId: null, el: null, ghost: null, startX: 0, startY: 0, x: 0, y: 0 };

// Find tier-content or card-pool under a point
function findDropTarget(x, y) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) {
    if (el.classList && (el.classList.contains('tier-content') || el.classList.contains('card-pool'))) {
      return el;
    }
  }
  return null;
}

function onDragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  el.classList.add('drag-over');
}

function onDragLeave(e, el) {
  el.classList.remove('drag-over');
}

function onDrop(e, el) {
  e.preventDefault();
  el.classList.remove('drag-over');
  
  if (!draggedCardId) return;
  
  const card = cards.find(c => c.id === draggedCardId);
  if (!card) return;
  
  // Remove from old location
  const oldEl = document.querySelector(`.card[data-card-id="${draggedCardId}"]`);
  if (oldEl) oldEl.remove();
  
  // Insert into new location at drop position
  const newEl = createCardEl(card);
  
  // Find insertion point based on mouse X
  const afterElement = getDragAfterElement(el, e.clientX);
  if (afterElement) {
    el.insertBefore(newEl, afterElement);
  } else {
    el.appendChild(newEl);
  }
  
  // Return any displaced cards to pool
  syncPool();
  updatePoolCount();
}

function getDragAfterElement(container, x) {
  const cards = [...container.querySelectorAll('.card:not(.dragging)')];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: -Infinity }).element;
}

function syncPool() {
  // Find cards in tiers that shouldn't be there (empty handling)
  // Also return cards to pool if dragged out of a tier back to pool
  const poolEl = document.getElementById('cardPool');
  
  // Get all cards currently in tiers
  const inTiers = new Set();
  document.querySelectorAll('.tier-content .card').forEach(el => {
    inTiers.add(el.dataset.cardId);
  });
  
  // Get cards in pool
  const inPool = new Set();
  poolEl.querySelectorAll('.card').forEach(el => {
    inPool.add(el.dataset.cardId);
  });
  
  // Find cards that are neither in tiers nor pool (orphaned) -> return to pool
  cards.forEach(c => {
    if (!inTiers.has(c.id) && !inPool.has(c.id)) {
      poolEl.appendChild(createCardEl(c));
    }
  });
}

// Allow dropping back into pool
document.addEventListener('DOMContentLoaded', () => {
  const pool = document.getElementById('cardPool');
  pool.addEventListener('dragover', (e) => { e.preventDefault(); pool.classList.add('drag-over'); });
  pool.addEventListener('dragleave', () => { pool.classList.remove('drag-over'); });
  pool.addEventListener('drop', (e) => {
    e.preventDefault();
    pool.classList.remove('drag-over');
    if (!draggedCardId) return;
    const card = cards.find(c => c.id === draggedCardId);
    if (!card) return;
    const oldEl = document.querySelector(`.card[data-card-id="${draggedCardId}"]`);
    if (oldEl) oldEl.remove();
    const newEl = createCardEl(card);
    const afterElement = getDragAfterElement(pool, e.clientX);
    if (afterElement) {
      pool.insertBefore(newEl, afterElement);
    } else {
      pool.appendChild(newEl);
    }
    updatePoolCount();
  });
});

function updatePoolCount() {
  const count = document.getElementById('cardPool').querySelectorAll('.card').length;
  // pool count display removed
}

function resetTiers() {
  document.querySelectorAll('.tier-content').forEach(el => el.innerHTML = '');
  buildPool();
}

async function downloadImage() {
  const header = document.getElementById('header');
  const poolSection = document.getElementById('poolSection');
  const caption = document.getElementById('caption');
  const area = document.getElementById('captureArea');
  
  // Card dimensions (must match CSS)
  const cardW = 90;
  const cardGap = 6;
  const tierPad = 8; // .tier-content padding
  const labelW = 80; // .tier-label width
  const minCards = 5;
  // minWidth applies to .tier-content only (not the label, which is a sibling)
  const contentMinWidth = tierPad * 2 + minCards * cardW + (minCards - 1) * cardGap;
  
  // Cover the page with a loading screen
  const screen = document.createElement('div');
  screen.style.cssText = 'position:fixed;inset:0;z-index:9998;background:#0a0a0a;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;';
  screen.textContent = 'Generating PNG...';
  document.body.appendChild(screen);
  
  // Hide header/pool, show caption for capture
  header.classList.add('hide-on-capture');
  poolSection.classList.add('hide-on-capture');
  caption.classList.remove('hide-on-capture');
  caption.style.display = 'block';
  
  // Let layout settle
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  
  function restoreAll() {
    header.classList.remove('hide-on-capture');
    poolSection.classList.remove('hide-on-capture');
    screen.remove();
  }
  
  try {
    const isMobile = window.innerWidth <= 768;
    // Add timeout in case html2canvas hangs on mobile
    const canvas = await Promise.race([
      html2canvas(area, {
        backgroundColor: '#0a0a0a',
        scale: isMobile ? 1 : 2,
        useCORS: true,
      }),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Capture timed out')), 15000))
    ]);
    
    // Restore DOM
    restoreAll();
    
    // Use blob URL so right-click "Save Image As" works
    // Fall back to dataURL if toBlob doesn't fire (some mobile browsers)
    const imgUrl = await new Promise(resolve => {
      let done = false;
      const fallback = setTimeout(() => {
        if (!done) { done = true; resolve(canvas.toDataURL('image/png')); }
      }, 2000);
      canvas.toBlob(function(blob) {
        if (!done) {
          done = true;
          clearTimeout(fallback);
          resolve(blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png'));
        }
      }, 'image/png');
    });
    const filename = 'tier-list.png';
    showPreviewOverlay(imgUrl, filename);
    
  } catch (err) {
    restoreAll();
    alert('Failed to capture: ' + err.message);
  }
}

// Show the generated PNG as an overlay. Uses blob: URL so the image is
// right-click savable in all browsers (data: URLs often aren't).
function showPreviewOverlay(imgUrl, filename) {
  // Build overlay without destroying the page
  const overlay = document.createElement('div');
  overlay.id = 'previewOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;overflow:auto;';
  
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'margin-bottom:16px;display:flex;gap:12px;flex-shrink:0;';
  
  const dl = document.createElement('a');
  dl.href = imgUrl;
  dl.download = filename || 'tier-list.png';
  dl.textContent = '⬇ Download PNG';
  dl.style.cssText = 'background:#4ecca3;color:#16213e;border:none;padding:12px 28px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;';
  
  const close = document.createElement('button');
  close.textContent = '✕ Close';
  close.style.cssText = 'background:#b22222;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;';
  close.onclick = function() {
    URL.revokeObjectURL(imgUrl);
    overlay.remove();
  };
  
  btnRow.appendChild(dl);
  btnRow.appendChild(close);
  
  const img = document.createElement('img');
  img.src = imgUrl;
  img.alt = 'Tier List';
  img.style.cssText = 'max-width:90vw;max-height:75vh;width:auto;height:auto;object-fit:contain;flex-shrink:1;';
  
  overlay.appendChild(btnRow);
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

init();
</script>

</body>
</html>
