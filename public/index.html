<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Battle Tier List</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Arial', 'Helvetica', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 2px solid #333;
}

.header img {
  width: 40px;
  height: auto;
  border-radius: 4px;
  border: 2px solid #5a3a1a;
}

.header input {
  background: #1a1a2e;
  border: 1px solid #444;
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 18px;
  font-weight: 700;
  flex: 1;
  max-width: 500px;
}

.header input:focus { outline: none; border-color: #b22222; }

.header .actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.header button {
  background: #b22222;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}

.header button:hover { background: #d32f2f; }
.header button.secondary { background: #333; }
.header button.secondary:hover { background: #444; }

/* Main layout */
.main {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
}

/* Tier list */
.tier-list {
  display: flex;
  flex-direction: column;
}

.tier-row {
  display: flex;
  align-items: stretch;
  min-height: 148px;
  border-bottom: 1px solid #333;
}

.tier-label {
  width: 80px;
  min-height: 148px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
  position: relative;
}


.tier-content {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: rgba(255,255,255,0.03);
  min-height: 148px;
  transition: background 0.15s;
}

.tier-content.drag-over {
  background: rgba(178,34,34,0.15);
}

/* Tier colors */
.tier-s { background: #ff6b6b; }
.tier-a { background: #ff9f43; }
.tier-b { background: #feca57; }
.tier-c { background: #48dbfb; }
.tier-d { background: #54a0ff; }
.tier-e { background: #5f27cd; }
.tier-f { background: #222; }

/* Card pool */
.pool-section {
  background: #111;
  border-top: 2px solid #333;
  border-bottom: 2px solid #333;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 90;
  overscroll-behavior: contain;
}

.pool-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.pool-header h2 {
  font-size: 18px;
  color: #888;
  font-weight: 700;
}

.pool-header .count {
  background: #333;
  color: #fff;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
}

.pool-header .pool-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.pool-header button {
  background: #333;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

.pool-header button:hover { background: #444; }

.card-pool {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 4px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #444 #222;
}

.card-pool::-webkit-scrollbar { height: 6px; }
.card-pool::-webkit-scrollbar-track { background: #222; border-radius: 3px; }
.card-pool::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

.card-pool.drag-over {
  background: rgba(178,34,34,0.1);
}

/* Cards */
.card {
  width: 90px;
  height: 132px;
  border-radius: 6px;
  overflow: hidden;
  cursor: grab;
  position: relative;
  border: 2px solid transparent;
  flex-shrink: 0;
  touch-action: pan-x;
}

.card-pool .card {
  touch-action: pan-x;
}

.tier-content .card {
  touch-action: none;
}

.card.dragging {
  opacity: 0.4;
  cursor: grabbing;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.card .card-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 8px;
  text-align: center;
  padding: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Capture container */
.capture-container {
  background: #0a0a0a;
  padding: 0;
}

/* Responsive */
@media (max-width: 768px) {
  .header { flex-wrap: wrap; padding: 12px 16px; }
  .header input { width: 100%; max-width: none; }
  .tier-label { width: 50px; font-size: 24px; min-height: 121px; }
  .tier-row { min-height: 121px; }
  .tier-content { min-height: 121px; }
  .card { width: 72px; height: 105px; }
  .header button { padding: 8px 12px; font-size: 12px; }
  .pool-section { padding: 10px 12px; }
  .card-pool { gap: 4px; padding: 6px 2px; }
  .pool-header { gap: 8px; margin-bottom: 6px; }
  .pool-header h2 { font-size: 15px; }
  .pool-header button { padding: 4px 10px; font-size: 11px; }
}

/* Hidden during capture */
.hide-on-capture { display: none !important; }

/* Caption */
.capture-caption {
  text-align: center;
  padding: 12px;
  font-size: 14px;
  color: #888;
  font-weight: 700;
  background: #0a0a0a;
  border-top: 1px solid #222;
}
</style>
</head>
<body>

<div class="header" id="header">
  <img src="back.png" alt="logo">
  <div class="actions">
    <button onclick="toggleFullscreen()">⛶ View Fullscreen</button>
    <button class="secondary" onclick="resetTiers()">Reset</button>
  </div>
</div>

<div class="pool-section" id="poolSection">
  <div class="pool-header">
    <h2>Drag & drop cards below</h2>
  </div>
  <div class="card-pool" id="cardPool"></div>
</div>

<div class="main capture-container" id="captureArea">
  <div class="tier-list" id="tierList"></div>
  <div class="capture-caption" id="caption">hb-tier.vercel.app · By <a href="https://x.com/axiemaid" target="_blank" style="color:#4ecca3;text-decoration:none;">axiemaid</a></div>
</div>

<script>
const TIERS = [
  { label: 'S', class: 'tier-s' },
  { label: 'A', class: 'tier-a' },
  { label: 'B', class: 'tier-b' },
  { label: 'C', class: 'tier-c' },
  { label: 'D', class: 'tier-d' },
  { label: 'F', class: 'tier-f' },
];

let cards = [];
let cardLocations = {}; // cardId -> { tier: index, order: n } or { pool: true }
let draggedCardId = null;

async function init() {
  const res = await fetch('cards.json');
  cards = await res.json();
  
  buildTiers();
  buildPool();
}

function buildTiers() {
  const list = document.getElementById('tierList');
  list.innerHTML = '';
  TIERS.forEach((tier, i) => {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `
      <div class="tier-label ${tier.class}" data-tier="${i}">${tier.label}</div>
      <div class="tier-content" data-tier="${i}" ondragover="onDragOver(event, this)" ondragleave="onDragLeave(event, this)" ondrop="onDrop(event, this)"></div>
    `;
    list.appendChild(row);
  });
}

function buildPool() {
  const pool = document.getElementById('cardPool');
  pool.innerHTML = '';
  
  const poolCards = cards.filter(c => !cardLocations[c.id]);
  poolCards.forEach(c => {
    const el = createCardEl(c);
    pool.appendChild(el);
  });
  
  updatePoolCount();
}

function createCardEl(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.innerHTML = `<img src="${card.image}" alt="${card.id}" loading="lazy">`;
  
  // Desktop drag-and-drop
  el.addEventListener('dragstart', (e) => {
    draggedCardId = card.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    draggedCardId = null;
  });
  
  // Touch drag-and-drop for mobile
  // Vertical movement = drag card, horizontal movement = scroll gallery
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchDrag.cardId = card.id;
    touchDrag.el = el;
    touchDrag.startX = e.touches[0].clientX;
    touchDrag.startY = e.touches[0].clientY;
    touchDrag.ghost = null;
    touchDrag.decided = false;
    touchDrag.isDrag = false;
    // Cards in tier rows can drag in any direction (no horizontal scroll to preserve)
    touchDrag.inTier = el.closest('.tier-content') !== null;
  }, { passive: true });
  
  el.addEventListener('touchmove', (e) => {
    if (!touchDrag.cardId) return;
    const t = e.touches[0];
    const dx = t.clientX - touchDrag.startX;
    const dy = t.clientY - touchDrag.startY;
    
    // Decide direction on first significant move
    if (!touchDrag.decided) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      touchDrag.decided = true;
      // In tier rows, always drag. In gallery, only vertical = drag.
      touchDrag.isDrag = touchDrag.inTier || Math.abs(dy) > Math.abs(dx);
    }
    
    // Let horizontal swipes scroll the gallery
    if (!touchDrag.isDrag) return;
    
    e.preventDefault();
    touchDrag.x = t.clientX;
    touchDrag.y = t.clientY;
    
    // Create ghost on first drag move
    if (!touchDrag.ghost) {
      touchDrag.el.classList.add('dragging');
      draggedCardId = touchDrag.cardId;
      const ghost = el.cloneNode(true);
      ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:10000;opacity:0.8;width:' + el.offsetWidth + 'px;height:' + el.offsetHeight + 'px;';
      document.body.appendChild(ghost);
      touchDrag.ghost = ghost;
    }
    
    // Move ghost
    touchDrag.ghost.style.left = (touchDrag.x - touchDrag.ghost.offsetWidth / 2) + 'px';
    touchDrag.ghost.style.top = (touchDrag.y - touchDrag.ghost.offsetHeight / 2) + 'px';
    
    // Highlight drop target
    const target = findDropTarget(touchDrag.x, touchDrag.y);
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (target) target.classList.add('drag-over');
  }, { passive: false });
  
  el.addEventListener('touchend', (e) => {
    if (!touchDrag.cardId) return;
    
    if (touchDrag.ghost) {
      touchDrag.ghost.remove();
      touchDrag.ghost = null;
    }
    touchDrag.el.classList.remove('dragging');
    
    // Only drop if we were dragging (not scrolling)
    if (touchDrag.isDrag) {
      const target = findDropTarget(touchDrag.x, touchDrag.y);
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      
      if (target && touchDrag.cardId) {
        const card = cards.find(c => c.id === touchDrag.cardId);
        if (card) {
          const oldEl = document.querySelector(`.card[data-card-id="${touchDrag.cardId}"]`);
          if (oldEl) oldEl.remove();
          const newEl = createCardEl(card);
          const afterElement = getDragAfterElement(target, touchDrag.x);
          if (afterElement) {
            target.insertBefore(newEl, afterElement);
          } else {
            target.appendChild(newEl);
          }
          syncPool();
        }
      }
    }
    
    touchDrag.cardId = null;
    touchDrag.el = null;
    touchDrag.decided = false;
    touchDrag.isDrag = false;
    draggedCardId = null;
  }, { passive: true });
  
  return el;
}

// Touch drag state
const touchDrag = { cardId: null, el: null, ghost: null, startX: 0, startY: 0, x: 0, y: 0, decided: false, isDrag: false };

// Find tier-content or card-pool under a point
function findDropTarget(x, y) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) {
    if (el.classList && (el.classList.contains('tier-content') || el.classList.contains('card-pool'))) {
      return el;
    }
  }
  return null;
}

function onDragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  el.classList.add('drag-over');
}

function onDragLeave(e, el) {
  el.classList.remove('drag-over');
}

function onDrop(e, el) {
  e.preventDefault();
  el.classList.remove('drag-over');
  
  if (!draggedCardId) return;
  
  const card = cards.find(c => c.id === draggedCardId);
  if (!card) return;
  
  // Remove from old location
  const oldEl = document.querySelector(`.card[data-card-id="${draggedCardId}"]`);
  if (oldEl) oldEl.remove();
  
  // Insert into new location at drop position
  const newEl = createCardEl(card);
  
  // Find insertion point based on mouse X
  const afterElement = getDragAfterElement(el, e.clientX);
  if (afterElement) {
    el.insertBefore(newEl, afterElement);
  } else {
    el.appendChild(newEl);
  }
  
  // Return any displaced cards to pool
  syncPool();
  updatePoolCount();
}

function getDragAfterElement(container, x) {
  const cards = [...container.querySelectorAll('.card:not(.dragging)')];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: -Infinity }).element;
}

function syncPool() {
  // Find cards in tiers that shouldn't be there (empty handling)
  // Also return cards to pool if dragged out of a tier back to pool
  const poolEl = document.getElementById('cardPool');
  
  // Get all cards currently in tiers
  const inTiers = new Set();
  document.querySelectorAll('.tier-content .card').forEach(el => {
    inTiers.add(el.dataset.cardId);
  });
  
  // Get cards in pool
  const inPool = new Set();
  poolEl.querySelectorAll('.card').forEach(el => {
    inPool.add(el.dataset.cardId);
  });
  
  // Find cards that are neither in tiers nor pool (orphaned) -> return to pool
  cards.forEach(c => {
    if (!inTiers.has(c.id) && !inPool.has(c.id)) {
      poolEl.appendChild(createCardEl(c));
    }
  });
}

// Allow dropping back into pool
document.addEventListener('DOMContentLoaded', () => {
  const pool = document.getElementById('cardPool');
  pool.addEventListener('dragover', (e) => { e.preventDefault(); pool.classList.add('drag-over'); });
  pool.addEventListener('dragleave', () => { pool.classList.remove('drag-over'); });
  pool.addEventListener('drop', (e) => {
    e.preventDefault();
    pool.classList.remove('drag-over');
    if (!draggedCardId) return;
    const card = cards.find(c => c.id === draggedCardId);
    if (!card) return;
    const oldEl = document.querySelector(`.card[data-card-id="${draggedCardId}"]`);
    if (oldEl) oldEl.remove();
    const newEl = createCardEl(card);
    const afterElement = getDragAfterElement(pool, e.clientX);
    if (afterElement) {
      pool.insertBefore(newEl, afterElement);
    } else {
      pool.appendChild(newEl);
    }
    updatePoolCount();
  });
});

function updatePoolCount() {
  const count = document.getElementById('cardPool').querySelectorAll('.card').length;
  // pool count display removed
}

function resetTiers() {
  document.querySelectorAll('.tier-content').forEach(el => el.innerHTML = '');
  buildPool();
}

let isFullscreen = false;

function toggleFullscreen() {
  const header = document.getElementById('header');
  const poolSection = document.getElementById('poolSection');
  const caption = document.getElementById('caption');
  
  isFullscreen = !isFullscreen;
  
  if (isFullscreen) {
    header.classList.add('hide-on-capture');
    poolSection.classList.add('hide-on-capture');
    caption.classList.remove('hide-on-capture');
    caption.style.display = 'block';
    
    // Add close button at top
    const closeBtn = document.createElement('button');
    closeBtn.id = 'fsClose';
    closeBtn.textContent = '✕ Exit Fullscreen';
    closeBtn.style.cssText = 'display:block;margin:12px auto 44px;width:fit-content;background:#b22222;color:#fff;border:none;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background 0.15s;';
    closeBtn.onmouseenter = function() { closeBtn.style.background = '#d32f2f'; };
    closeBtn.onmouseleave = function() { closeBtn.style.background = '#b22222'; };
    closeBtn.onclick = toggleFullscreen;
    const area = document.getElementById('captureArea');
    area.insertBefore(closeBtn, area.firstChild);
  } else {
    header.classList.remove('hide-on-capture');
    poolSection.classList.remove('hide-on-capture');
    caption.style.display = '';
    const closeBtn = document.getElementById('fsClose');
    if (closeBtn) closeBtn.remove();
  }
}

init();
</script>

</body>
</html>
